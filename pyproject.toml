[project]
name = "pypnbpartkeepr"
version = "0.1.0"
description = "New Django version from scratch of PartKeepr"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=4.0,<5.0",
    "django-bootstrap4",
    "django-cleanup",
    "django-jsonify",
    "django-dbbackup",
    "django-money",
    "django-phone-field",
    "django-mptt",
    "django-view-breadcrumbs",
    "django-extensions",
    #"psycopg2>=2.7.0,<3.0.0",
    "psycopg2-binary",
    "whitenoise",
    "pillow",
    "legacy-cgi",
    "pyyaml",
    # Runtime, not tooling: pnbpartkeepr_systemd_venv.service execs it,
    # so `uv sync --no-dev` on the production host must install it.
    "gunicorn",
]

[dependency-groups]
dev = [
    "pycodestyle",
    "pylint",
    "black",
    "reuse",
    "astroid>=3.2.2",
    "docutils",
    "pydotplus",
    "pylint-django",
    "django-debug-toolbar",
    "django-stubs",
]

[tool.uv]
package = false
default-groups = "all"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
