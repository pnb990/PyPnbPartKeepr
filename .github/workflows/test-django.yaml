---

"on":
  push:

jobs:
  test-django:
    # node for the JavaScript actions, git and uv all come from the image,
    # built by soft-lib/docker-images. Pinned to a commit tag: bumping it
    # is a reviewable commit here, rolling back is a git revert.
    runs-on: debian
    container:
      image: pnb990/python3:ci-4999611e8691571ca308b4058be173a359542be6
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      # --frozen, so a stale uv.lock fails the run instead of silently
      # resolving to something else.
      - name: Install dependencies
        run: uv sync --dev --frozen

      # No `services:` and no postgres here: settings.py swaps DATABASES for
      # a throwaway sqlite file when "test" is in argv, so the suite needs
      # nothing but the image.
      - name: Run Django tests
        run: uv run ./manage.py test --verbosity=2
