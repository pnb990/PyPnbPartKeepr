---

"on":
  push:

# NOTE: this project still uses pipenv, and the published images ship uv
# only. Migrate it to uv (pyproject + uv.lock) to run in
# `container: image: pnb990/python3:ci-c9355ba02d0e1c407495b3ac7c389e8b329850fa` and drop the install steps below.
jobs:
  test-django:
    runs-on: PIPENV
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Install pipenv
        run: which pipenv || (apt-get update && apt-get install -y pipenv libpq-dev)

      - name: Install dependencies
        run: pipenv install --deploy

      - name: Set up the database
        run: ls -al

      - name: Run Django tests
        run: pipenv run ./manage.py test --verbosity=2
